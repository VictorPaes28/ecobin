; EcoBin - firmware do ESP32 (PlatformIO)
;
;   pio run -e esp32dev -t upload   -> compila e grava na placa real
;   pio device monitor              -> abre o Serial (115200)
;   pio run -e wokwi                -> compila para simular no Wokwi (extensao do VS Code)
;
; Na extensao do VS Code: barra lateral do PlatformIO > escolher o ambiente > Build / Upload / Monitor.

[platformio]
default_envs = esp32dev

[env]
platform = espressif32 @ 6.13.0   ; Arduino core 2.0.17 (versoes fixas: todo o grupo compila igual)
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    knolleary/PubSubClient @ 2.8.0
    bblanchon/ArduinoJson @ 7.4.3

; Placa real: rede e broker vem de include/segredos.h (fora do Git)
[env:esp32dev]
build_flags = -DSIMULACAO_WOKWI=0
upload_speed = 115200   ; mais lento e mais seguro (a leitura do chip mostrou ruido na serial)

; Simulacao: rede Wokwi-GUEST e broker publico
[env:wokwi]
build_flags = -DSIMULACAO_WOKWI=1
