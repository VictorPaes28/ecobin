# Broker MQTT local do EcoBin (Mosquitto 2.x)
# Rodar a partir desta pasta:  iniciar.bat   (ou: mosquitto -c mosquitto.conf -v)
#
# Portas proprias (1884 e 9001) para nao brigar com o servico padrao do Mosquitto,
# que ja ocupa a 1883 so dentro do PC.

allow_anonymous false
password_file senhas
acl_file acl

# ESP32 e simulador (MQTT puro)
listener 1884 0.0.0.0

# Painel web no navegador (MQTT sobre WebSocket)
listener 9001 0.0.0.0
protocol websockets

persistence false
log_timestamp_format %H:%M:%S
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
